[build]
  base = "frontend"
  command = "pnpm install && pnpm run build"
  publish = "dist"

# Environment variables (also set these in Netlify Dashboard → Site Settings → Environment Variables):
# VITE_API_URL = "https://your-backend-url.com/api"
# VITE_GOOGLE_CLIENT_ID = "your-google-client-id" (optional, auto-detected)

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Embedder-Policy = "credentialless"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    # connect-src's *.onrender.com is a placeholder for the Render backend —
    # tighten to the exact API domain once it's fixed.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'; frame-src https://accounts.google.com; img-src 'self' data: https://media.giphy.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; connect-src 'self' https://cdn.jsdelivr.net https://accounts.google.com https://www.googleapis.com https://*.onrender.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

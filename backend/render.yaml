# Render.com blueprint — deploy the FastAPI backend (auth + SQLite).
#
# Steps:
#   1. Push this repo to GitHub.
#   2. Render → New → Blueprint → select this repo (reads backend/render.yaml).
#   3. When live, copy the service URL (e.g. https://dblearn-backend.onrender.com)
#      → Vercel → Settings → Environment Variables:
#           VITE_API_URL = https://dblearn-backend.onrender.com/api
#      → Redeploy the Vercel frontend.
#   4. Update FRONTEND_URL below to your exact Vercel domain (CORS).
services:
  - type: web
    name: dblearn-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Render defaults to the newest Python (3.14), which has no prebuilt
      # wheels for pydantic-core/asyncpg — pip falls back to a Rust source
      # build and dies on Render's read-only cargo dir. Matches Dockerfile.
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true          # random, stable per service
      - key: DEBUG
        value: "false"
      # Your own Vercel domain — prompted at Blueprint setup, not hardcoded.
      # CORS is exact-match (app/main.py), so this must be the deployment you
      # actually control. Never point it at an upstream/third-party domain:
      # that adds someone else's origin to your credentialed allowlist.
      - key: FRONTEND_URL
        sync: false
      # Free plan has NO persistent disk — SQLite would reset on every
      # redeploy/sleep. DATABASE_URL points at managed Postgres instead
      # (Neon/Supabase) so accounts survive. sync: false means Render
      # won't store a value in this file — it prompts for it once during
      # Blueprint setup and keeps it in the dashboard from then on.
      - key: DATABASE_URL
        sync: false
      # ── Tutor grading + hint service ──────────────────────────────────
      # The hint panel's only backend. Empty URL disables the integration
      # silently (app/services/tutor_client.py returns None before any HTTP),
      # which surfaces in the UI as "Couldn't reach the AI Tutor" — the
      # deploy-time failure this pair exists to prevent. Point it at the
      # deployed intelligent-tutor service, no trailing slash:
      #   https://dblearn-tutor.onrender.com
      - key: TUTOR_SERVICE_URL
        sync: false
      # Must equal the tutor service's own SERVICE_KEY. Empty on BOTH sides
      # disables auth between them — acceptable only for a local trial, never
      # for two internet-reachable services.
      - key: TUTOR_SERVICE_KEY
        sync: false
